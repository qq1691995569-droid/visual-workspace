:clamp(320px,49vh,620px);border:1px dashed #cedbd0;background:#f7f9f5;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;position:relative;transition:background .2s,border-color .2s}.stage:has(.empty[hidden]){border:1px solid #e1e6df;background:repeating-conic-gradient(#f0f2ed 0% 25%,#f7f8f5 0% 50%) 50%/18px 18px}.stage canvas{max-width:100%;max-height:100%;touch-action:none;cursor:crosshair}.empty{position:absolute;text-align:center;color:#5c7865;font-size:14px;pointer-events:none;line-height:1.8}.empty:before{content:'＋';display:block;font-size:27px;font-weight:300;width:56px;height:56px;line-height:54px;border:1px solid #dbe5d8;background:#edf3e9;border-radius:16px;margin:0 auto 18px;color:#7c977d}.empty:after{content:'PNG · JPG · WebP';display:block;font-size:11px;color:#97a397;margin-top:7px;letter-spacing:1px}.stage:has(.empty:not([hidden])){cursor:pointer}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tools select{flex:1;min-width:0}button,select{font:inherit;border-radius:9px;border:1px solid var(--line);padding:10px 12px;background:#fff;color:#4f6858;cursor:pointer;transition:background .15s,box-shadow .15s}button:hover:not(:disabled){background:#f1f5ee;border-color:#bfd0c1}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #6b9877;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.primary{background:var(--green);color:white;border-color:var(--green);font-weight:600}.primary:hover:not(:disabled){background:#376f53;border-color:#376f53}.caption{font-size:11px;color:#8a958d;line-height:1.8;margin-top:13px}.settings{padding:22px}.settings h2{margin-bottom:18px}#match{width:100%;padding:12px;font-size:13px}#controls{margin:22px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--line)}label.control{display:block;margin:0 0 17px}label.control span{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#617366;margin-bottom:4px}output{color:#446d50;background:#f0f5ec;padding:2px 7px;border-radius:5px;font-size:11px;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}input[type=range]{width:100%;height:18px;accent-color:#648b6c;cursor:pointer}.settings>.control{margin-top:17px}.settings>.tools{display:grid;grid-template-columns:1fr 1.3fr;gap:8px}.settings>.tools button{font-size:12px;padding:12px 9px}#status{padding:11px 12px;font-size:11px;line-height:1.8;margin:16px 0 0;color:#6a7f6d;background:#f5f8f1;border-radius:8px;overflow-wrap:anywhere}.help{margin-top:16px;font-size:11px;color:#8c988e;line-height:1.8}.help summary{cursor:pointer;color:#788d7c}.help p{margin:8px 0 0}.settings>details:not(.help){font-size:12px!important;margin-top:17px!important;padding-top:14px!important}.settings>details p{overflow-wrap:anywhere}.settings>details select{font-size:11px}.resulthead{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 24px;border-bottom:1px solid #dce4da}.resulthead h2{margin:0;font-size:16px}.resulthead>span{font-size:11px}.resulthead button{font-size:12px;padding:8px 13px}dialog{width:min(96vw,1560px);max-width:96vw;max-height:94dvh;padding:0;border:1px solid #cdd9ce;border-radius:20px;background:#fff;color:var(--ink);overflow:hidden;box-shadow:0 30px 100px #06160e4d}dialog::backdrop{background:#102b20b3;backdrop-filter:blur(6px)}#previewSource{display:none}#dialogContent{border-radius:0!important;padding:18px 22px 22px!important;max-height:calc(94dvh - 74px);overflow:auto}#dialogContent .bar{padding-bottom:14px!important}#dialogContent .preview-layout{grid-template-columns:minmax(0,1fr) 260px!important;gap:18px!important}#dialogContent .viewport{min-height:300px!important}#dialogContent .preview-parameters{padding:20px!important;max-height:72dvh;overflow:auto}#dialogContent .parameter-control{margin-bottom:19px!important}#dialogContent output{background:#3b4f42;color:#c6e4cb!important}#dialogContent h3{margin-bottom:24px!important}#dialogContent #previewInfo{padding-top:14px;border-top:1px solid #435349;font-size:11px!important}#dialogContent #exportInfo{font-size:11px!important}#dialogContent .drag-tip{font-size:11px!important;color:#7e9988!important}#dialogContent .bar button{font-size:12px!important;font-weight:600}p{line-height:1.8}

<main><header><div><div class="muted">SCENE TONE / 本地影像工作台</div><h1>场景调色工作台</h1><small class="muted">从参考到统一色调，让每个场景保持一致的视觉氛围。</small></div><div class="badge">本地处理 · 图片不上传</div></header>
<div class="grid">
<section class="card"><div class="image-heading"><h2><span class="step">01</span>目标场景</h2><label class="upload-label">选择图片<input class="file-input" id="targetFile" type="file" aria-label="目标场景图片" accept="image/png,image/jpeg,image/webp"></label></div><div class="stage"><span class="empty" id="targetEmpty">上传目标场景</span><canvas id="target"></canvas></div><div class="tools"><select id="targetMode"><option value="include">涂选取样区域</option><option value="exclude">涂选排除区域</option><option value="erase">擦除选区</option></select><button id="targetClear">清空选区</button></div><div class="caption">绿色取样 · 红色排除，仅用于改善整体初调的取样范围。</div></section>
<section class="card"><div class="image-heading"><h2><span class="step">02</span>风格参考</h2><label class="upload-label">选择图片<input class="file-input" id="referenceFile" type="file" aria-label="风格参考图片" accept="image/png,image/jpeg,image/webp"></label></div><div class="stage"><span class="empty" id="referenceEmpty">上传理想风格</span><canvas id="reference"></canvas></div><div class="tools"><select id="referenceMode"><option value="include">涂选取样区域</option><option value="exclude">涂选排除区域</option><option value="erase">擦除选区</option></select><button id="referenceClear">清空选区</button></div><div class="caption">可涂选对应墙面或地面，不要求构图和位置一致。</div></section>
<section class="card settings"><h2><span class="step">03</span>调色控制</h2><button class="primary" id="match" disabled>一键初调 / 重新取样</button><div id="controls"></div><label class="control"><span>取样笔刷大小</span><input id="brush" type="range" min="5" max="100" value="35"></label><div class="tools"><button id="reset">重置调整</button><button id="openPreview" class="primary" disabled>查看效果</button></div><div id="status" role="status">上传两张图片后开始。支持 PNG、JPEG、WebP。</div><details class="help"><summary>取样与调色说明</summary><p>初调优先分析中等亮度、低彩度区域。两张图内容差异较大时，可涂选对应墙面或地面后重新取样。</p></details></section>
</div>
<div id="previewSource" hidden><button id="export" disabled>导出原尺寸 PNG</button><button id="params" disabled>保存参数</button><span id="dimensions">预览长边最多 1200 px，导出使用原始尺寸。建议使用 sRGB 图片。</span><canvas id="output"></canvas><canvas id="before"></canvas><input id="compare" type="range" min="0" max="100" value="50"></div>
<dialog id="previewDialog" aria-labelledby="previewTitle"><div class="resulthead"><h2 id="previewTitle">效果预览</h2><button id="closePreview">关闭预览</button></div><div id="dialogContent"></div></dialog></main>
